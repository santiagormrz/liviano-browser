org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Versión de GeckoView (motor de Firefox).
# "+" toma siempre la última versión estable publicada por Mozilla.
# Para builds reproducibles, fijala, p. ej.: geckoviewVersion=145.0.20251110000000
geckoviewVersion=+
