name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Opcional: firma con tu propia clave para poder actualizar sin desinstalar.
      # Creá los secretos KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS y KEY_PASSWORD.
      - name: Preparar clave de firma
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/liviano.jks"
          echo "LIVIANO_KEYSTORE=$RUNNER_TEMP/liviano.jks" >> "$GITHUB_ENV"

      - name: Compilar
        env:
          LIVIANO_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          LIVIANO_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          LIVIANO_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Liviano-APK
          path: app/build/outputs/apk/release/*.apk
